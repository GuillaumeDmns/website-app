name: Build
# Every pull request and every push to master: analysis, unit and widget tests, integration tests on the Linux app
# (virtual screen), then the production builds (web, Android). The "Test" and "Build" checks are required to merge
# into master (branch protection).
on:
  pull_request:
  push:
    branches: [master]
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🛠 Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev xvfb
      - name: Dependencies and generated code
        run: |
          flutter pub get
          dart run build_runner build -d
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Integration tests (Linux app)
        # One file at a time: started for a second file in the same run, the Linux app never connects
        run: |
          for test in integration_test/*_test.dart; do
            xvfb-run -a flutter test "$test" -d linux
          done

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version comes from the last tag (tool/version.sh)
          fetch-depth: 0
      - name: 🛠 Set up Java 21 (Android build)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: 🛠 Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Dependencies and generated code
        run: |
          flutter pub get
          dart run build_runner build -d
      - name: Web (prod)
        run: tool/build.sh web --dart-define=APP_ENV=prod --no-web-resources-cdn
      # Signed with the debug key here: the upload key stays off GitHub until the Play Store (android/key.properties)
      - name: Android (prod)
        run: tool/build.sh apk --flavor prod
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-prod-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-prod-release.apk
          retention-days: 14
