name: Build
# Every pull request and every push to master: analysis, unit and widget tests, integration tests on the Linux app
# (virtual screen), then the production builds (web, Android). The "Test" and "Build" checks are required to merge
# into master (branch protection).
on:
  pull_request:
  push:
    branches: [master]
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: 🛠 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev xvfb
      - name: Dependencies and generated code
        run: |
          flutter pub get
          dart run build_runner build -d
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Integration tests (Linux app)
        run: xvfb-run -a flutter test integration_test -d linux

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: 🛠 Set up Java 21 (Android build)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: 🛠 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Dependencies and generated code
        run: |
          flutter pub get
          dart run build_runner build -d
      - name: Web (prod)
        run: flutter build web --dart-define=APP_ENV=prod --no-web-resources-cdn
      # Signed with the debug key here: the upload key stays off GitHub until the Play Store (android/key.properties)
      - name: Android (prod)
        run: flutter build apk --flavor prod --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v5
        with:
          name: app-prod-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-prod-release.apk
          retention-days: 14
