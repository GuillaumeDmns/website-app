name: Build
# Every pull request and every push to master: analysis, unit and widget tests, integration tests on the Linux app
# (virtual screen), then the production builds (web, Android). Four jobs side by side, the run lasts as long as the
# slowest one (Android).
on:
  pull_request:
  push:
    branches: [master]
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🛠 Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Dependencies and generated code
        run: |
          flutter pub get
          dart run build_runner build -d
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🛠 Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libepoxy-dev libsecret-1-dev libjsoncpp-dev xvfb
      - name: Dependencies and generated code
        run: |
          flutter pub get
          dart run build_runner build -d
      - name: Integration tests (Linux app)
        # One file at a time: started for a second file in the same run, the Linux app never connects
        run: |
          for test in integration_test/*_test.dart; do
            xvfb-run -a flutter test "$test" -d linux
          done

  web:
    name: Build web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version comes from the last tag (tool/version.sh)
          fetch-depth: 0
      - name: 🛠 Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Dependencies and generated code
        run: |
          flutter pub get
          dart run build_runner build -d
      - name: Web (prod)
        run: tool/build.sh web --dart-define=APP_ENV=prod --no-web-resources-cdn

  android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version comes from the last tag (tool/version.sh)
          fetch-depth: 0
      - name: 🛠 Set up Java 21 (Android build)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '21'
          distribution: 'temurin'
          # Gradle's wrapper, dependencies and build cache (below): without them, a minute of downloads at every run.
          # pubspec.lock in the key: the Flutter plugins are Gradle projects too
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock
      - name: 🛠 Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Dependencies and generated code
        run: |
          flutter pub get
          dart run build_runner build -d
      - name: Gradle build cache
        # The compiled plugins (Kotlin, Java) come back from ~/.gradle/caches, saved with it
        run: mkdir -p ~/.gradle && echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
      # Signed with the debug key here: the upload key stays off GitHub until the Play Store (android/key.properties).
      # arm64 only (every phone of the last years): one Dart AOT compilation and one native maplibre instead of three.
      # The releases (release.yml) keep the three architectures.
      - name: Android (prod)
        run: tool/build.sh apk --flavor prod --target-platform android-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-prod-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-prod-release.apk
          retention-days: 14
