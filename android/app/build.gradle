plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.guillaumedamiens.app"
    compileSdk = 37
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    defaultConfig {
        applicationId = "com.guillaumedamiens.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    // Two apps side by side: dev talks to the backend of the development machine, prod to guillaumedamiens.com
    // (lib/core/config.dart reads the flavor). flutter run / build without --flavor is dev (pubspec.yaml).
    flavorDimensions = ["environment"]
    productFlavors {
        dev {
            dimension = "environment"
            applicationIdSuffix = ".dev"
            resValue "string", "app_name", "Guillaume Dev"
        }
        prod {
            dimension = "environment"
            resValue "string", "app_name", "Guillaume"
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
    buildFeatures {
        viewBinding true
        // app_name per flavor
        resValues true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}


dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'com.google.android.gms:play-services-location:21.4.0'
}

flutter {
    source = "../.."
}
