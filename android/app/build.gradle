plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing key (upload key for Google Play), outside the repository: android/key.properties with storeFile,
// storePassword, keyAlias and keyPassword. Without it, release builds are signed with the debug key (local tests only).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.guillaumedamiens.app"
    compileSdk = 37
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    defaultConfig {
        applicationId = "com.guillaumedamiens.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    // Three apps side by side (lib/core/config.dart reads the flavor; flutter run / build without --flavor is dev,
    // pubspec.yaml): dev talks to the backend of the development machine (orange icon); beta is a build of this
    // machine on guillaumedamiens.com, installed with adb next to the store's app (green icon, no App Links); prod is
    // the Google Play app.
    flavorDimensions = ["environment"]
    productFlavors {
        dev {
            dimension = "environment"
            applicationIdSuffix = ".dev"
            resValue "string", "app_name", "Nav\\' Dev"
        }
        beta {
            dimension = "environment"
            applicationIdSuffix = ".beta"
            resValue "string", "app_name", "Nav\\' Beta"
        }
        prod {
            dimension = "environment"
            resValue "string", "app_name", "Nav\\'"
        }
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            // R8 and resource shrinking come from the Flutter Gradle plugin (release builds)
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    buildFeatures {
        viewBinding true
        // app_name per flavor
        resValues true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}


dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    // The widget's periodic refresh (WidgetRefreshWorker); the version home_widget brings
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
}

flutter {
    source = "../.."
}
