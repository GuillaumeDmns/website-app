name: website_app
description: "Guillaume Damiens mobile application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  flutter_map: ^8.3.1
  latlong2: ^0.9.1
  flutter_secure_storage: ^11.0.0
  geolocator: ^14.0.3
  intl: ^0.20.3
  flutter_map_animations: ^0.10.0
  home_widget: ^0.10.0
  google_fonts: ^8.2.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  maplibre: ^0.3.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1

flutter:

  uses-material-design: true

  # Inter, bundled: no request to Google's servers at startup (google_fonts finds the files by name)
  assets:
    - assets/google_fonts/

  # Android flavor when none is given (flutter run, the IDE): the dev app, on the development backend
  default-flavor: dev

  # Translations from lib/l10n (see l10n.yaml)
  generate: true

