<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Transports d'Île-de-France en temps réel : départs, itinéraires, info trafic.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Guillaume">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Guillaume</title>
  <link rel="manifest" href="manifest.json">

  <!-- MapLibre GL JS, drawn by the package maplibre on the web (pinned version) -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script>
    // Fixes to the map of the package maplibre:
    // - it is created in a detached element at the window's size, then Flutter moves it into its platform view:
    //   MapLibre never notices, its canvas stays at the window's size. Follow the container instead (and draw again:
    //   resizing clears the canvas).
    // - fitBounds adds the padding left by the previous move (a pin framed above the panel) to its own: frame with
    //   its padding only, and leave none.
    if (window.maplibregl) {
      const MapLibreMap = maplibregl.Map;
      maplibregl.Map = class extends MapLibreMap {
        constructor(options) {
          super(options);
          new ResizeObserver(() => {
            const container = this.getContainer();
            const canvas = this.getCanvas();
            if (container.clientWidth > 0 && container.clientHeight > 0
                && (canvas.clientWidth !== container.clientWidth || canvas.clientHeight !== container.clientHeight)) {
              this.resize();
              this.triggerRepaint();
            }
          }).observe(this.getContainer());
        }

        fitBounds(bounds, options = {}, eventData) {
          const none = { top: 0, right: 0, bottom: 0, left: 0 };
          const kept = this.getPadding();
          this.setPadding(none);
          const camera = this.cameraForBounds(bounds, options);
          this.setPadding(kept);
          if (!camera) {
            return this;
          }
          const { padding, offset, maxZoom, ...move } = options;
          const target = { ...move, ...camera, padding: none };
          return options.linear ? this.easeTo(target, eventData) : this.flyTo(target, eventData);
        }
      };
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
