<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Transports d'Île-de-France en temps réel : départs, itinéraires, info trafic.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nav'">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nav'</title>
  <link rel="manifest" href="manifest.json">

  <!-- MapLibre GL JS and PMTiles, which the package maplibre loads itself on the web from jsDelivr (npm): these exact
       versions, never a range, so that an update is a change of this page (test/web_page_test.dart). -->
  <script>
    window.flutterMapLibre = {
      maplibreGlVersion: '6.18.0',
      pmtilesVersion: '4.5.0',
    };
  </script>
</head>
<body>
  <!-- What the page is without JavaScript (crawlers, and Google's check of the OAuth consent screen's home page: the
       app's name and a link to its privacy policy) -->
  <noscript>
    <h1>Nav'</h1>
    <p>Transports d'Île-de-France en temps réel : départs, itinéraires, info trafic.</p>
    <p><a href="/privacy">Mentions légales et confidentialité</a></p>
  </noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
